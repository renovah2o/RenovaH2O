<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f5f5f7">
  <title>Mi cuenta | RenovaH2O</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;line-height:1.5}
    main{min-height:100vh;padding:108px 20px 56px;display:grid;place-items:center}
    .account-card{width:min(100%,460px);padding:38px;border:1px solid #e3e3e8;border-radius:24px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.07)}
    h1{margin:0;font-size:32px;letter-spacing:-.05em}
    .intro{margin:8px 0 26px;color:#6e6e73}
    .field{display:grid;gap:7px;margin:16px 0}
    label{font-size:14px;font-weight:600}
    input{width:100%;padding:12px 14px;border:1px solid #d2d2d7;border-radius:10px;font:inherit}
    input:focus{outline:3px solid rgba(0,113,227,.2);border-color:#0071e3}
    button{width:100%;min-height:46px;padding:10px 16px;border:0;border-radius:999px;background:#0071e3;color:#fff;font:inherit;font-weight:600;cursor:pointer}
    button:hover{background:#0064c8}
    button:disabled{opacity:.6;cursor:wait}
    .google{margin-top:12px;background:#fff;color:#1d1d1f;border:1px solid #d2d2d7}
    .google:hover{background:#f5f5f7}
    .switch{margin:20px 0 0;text-align:center;color:#6e6e73;font-size:14px}
    .switch button{width:auto;min-height:0;padding:0;background:none;color:#0071e3;font-size:inherit}
    .message{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:#f2f7ff;color:#174e85;font-size:14px}
    .message[hidden],.auth-form[hidden],.signed-in[hidden]{display:none}
    .signed-in{display:grid;gap:16px}
    .signed-in p{margin:0;color:#6e6e73;overflow-wrap:anywhere}
    @media(max-width:520px){.account-card{padding:28px 22px}}
  </style>
  <script src="/share.js" defer></script>
  <script src="/supabase-config.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const config = window.RENOVA_SUPABASE_CONFIG;
    const form = document.querySelector("#auth-form");
    const heading = document.querySelector("#heading");
    const intro = document.querySelector("#intro");
    const submit = document.querySelector("#submit");
    const googleButton = document.querySelector("#google");
    const switchButton = document.querySelector("#switch-mode");
    const switchText = document.querySelector("#switch-text");
    const message = document.querySelector("#message");
    const signedIn = document.querySelector("#signed-in");
    const accountEmail = document.querySelector("#account-email");
    let mode = "signin";
    let supabase;

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
    }

    function setBusy(busy) {
      submit.disabled = busy;
      googleButton.disabled = busy;
      switchButton.disabled = busy;
    }

    function updateMode() {
      const isSignup = mode === "signup";
      heading.textContent = isSignup ? "Crea tu cuenta" : "Inicia sesión";
      intro.textContent = isSignup
        ? "Regístrate para continuar con RenovaH2O."
        : "Accede a tu cuenta de RenovaH2O.";
      submit.textContent = isSignup ? "Crear cuenta" : "Iniciar sesión";
      switchText.textContent = isSignup ? "¿Ya tienes cuenta?" : "¿Aún no tienes cuenta?";
      switchButton.textContent = isSignup ? "Inicia sesión" : "Regístrate";
    }

    function showSession(session) {
      form.hidden = Boolean(session);
      signedIn.hidden = !session;
      if (session) accountEmail.textContent = session.user.email ?? "Sesión iniciada";
    }

    switchButton.addEventListener("click", () => {
      mode = mode === "signin" ? "signup" : "signin";
      message.hidden = true;
      updateMode();
    });

    if (!config?.url || !config.publishableKey) {
      setBusy(true);
      showMessage("Falta configurar la clave pública de Supabase en supabase-config.js. No uses la clave service_role.");
    } else {
      supabase = createClient(config.url, config.publishableKey);
      supabase.auth.getSession().then(({ data, error }) => {
        if (error) {
          showMessage(`No se pudo comprobar la sesión: ${error.message}`);
          return;
        }
        showSession(data.session);
      });

      supabase.auth.onAuthStateChange((_event, session) => showSession(session));

      form.addEventListener("submit", async event => {
        event.preventDefault();
        message.hidden = true;
        setBusy(true);

        const email = new FormData(form).get("email").toString().trim();
        const password = new FormData(form).get("password").toString();
        try {
          const result = mode === "signup"
            ? await supabase.auth.signUp({
                email,
                password,
                options: { emailRedirectTo: `${window.location.origin}/cuenta` }
              })
            : await supabase.auth.signInWithPassword({ email, password });

          if (result.error) {
            showMessage(result.error.message);
          } else if (mode === "signup" && !result.data.session) {
            showMessage("Revisa tu correo para confirmar la cuenta y luego inicia sesión.");
          } else if (!result.data.session) {
            showMessage("No se pudo iniciar la sesión. Inténtalo de nuevo.");
          }
        } catch (error) {
          showMessage(`No se pudo completar la solicitud: ${error.message}`);
        } finally {
          setBusy(false);
        }
      });

      googleButton.addEventListener("click", async () => {
        message.hidden = true;
        setBusy(true);
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: `${window.location.origin}/cuenta` }
          });
          if (error) showMessage(error.message);
        } catch (error) {
          showMessage(`No se pudo iniciar sesión con Google: ${error.message}`);
        } finally {
          setBusy(false);
        }
      });

      document.querySelector("#sign-out").addEventListener("click", async () => {
        try {
          const { error } = await supabase.auth.signOut();
          if (error) showMessage(`No se pudo cerrar la sesión: ${error.message}`);
        } catch (error) {
          showMessage(`No se pudo cerrar la sesión: ${error.message}`);
        }
      });
    }

    updateMode();
  </script>
</head>
<body>
  <main>
    <section class="account-card" aria-labelledby="heading">
      <h1 id="heading">Inicia sesión</h1>
      <p class="intro" id="intro">Accede a tu cuenta de RenovaH2O.</p>
      <form class="auth-form" id="auth-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <button id="submit" type="submit">Iniciar sesión</button>
        <button class="google" id="google" type="button">Continuar con Google</button>
        <p class="switch"><span id="switch-text">¿Aún no tienes cuenta?</span> <button id="switch-mode" type="button">Regístrate</button></p>
      </form>
      <div class="signed-in" id="signed-in" hidden>
        <p>Sesión iniciada como <strong id="account-email"></strong></p>
        <button id="sign-out" type="button">Cerrar sesión</button>
      </div>
      <p class="message" id="message" role="status" aria-live="polite" hidden></p>
    </section>
  </main>
</body>
</html>

<style>

<script id="rh2o-active-nav-script">(()=>{const clean=p=>{let v=(p||"/").replace(/\.html$/i,"").replace(/\/$/,"");return v||"/"};const path=clean(location.pathname);const links=[...document.querySelectorAll("#site-header .nav-links a,.nav-links a,#site-mobile a")];const hasExact=links.some(el=>{try{return clean(new URL(el.getAttribute("href"),location.origin).pathname)===path}catch{return false}});const services=["/limpieza-de-pisos-panama","/limpieza-de-estacionamientos-panama","/alquiler-de-hidrolavadoras-panama","/lavado-de-pisos","/lavado-de-estacionamientos","/lavado-de-terrazas","/hidrolavado-arraijan","/hidrolavado-chorrera","/hidrolavadora-panama","/lavado-a-presion-panama-oeste","/mantenimiento-programado"];const isService=services.includes(path)||path.startsWith("/servicio-");const isBlog=path==="/blog"||path.startsWith("/blog/")||["/cuando-hacer-hidrolavado","/hidrolavado-vs-limpieza-tradicional","/limpieza-profunda-pisos-limo-moho"].includes(path);links.forEach(el=>{try{const u=new URL(el.getAttribute("href"),location.origin);const target=clean(u.pathname);if(target===path||(isService&&!hasExact&&u.hash==="#servicios")||(isBlog&&target==="/blog")){el.classList.add("is-current");el.setAttribute("aria-current","page")}}catch{}});const account=document.querySelector("#site-header .account-icon-button,.nav .account-icon-button");if(account&&path==="/cuenta"){account.classList.add("is-current");account.setAttribute("aria-current","page")}const shop=document.querySelector("#site-header .shop-button,.nav .shop-button,.nav .shop-pill");if(shop&&(path==="/tienda"||path.startsWith("/tienda/"))){shop.classList.add("is-current");shop.setAttribute("aria-current","page");document.querySelectorAll('.nav-links a[href="/tienda"]').forEach(a=>{a.classList.remove("is-current");a.removeAttribute("aria-current")})}const cart=document.querySelector("#site-header a[href='/carrito'],.nav a[href='/carrito']");if(cart&&path==="/carrito"){cart.classList.add("is-current");cart.setAttribute("aria-current","page")}})();</script>
